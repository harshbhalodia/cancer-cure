# Care Advisor Pack: Daily wellbeing strategy
id: carecompanion.wellbeing
name: Daily wellbeing strategy
publisher: Cancer-Cure Companion
version: "0.1.0"
kind: plan
allow_general_figures: true

summary: >
  A gentle weekly strategy for diet, daily routine, medicines (staying on track), mind and manifestation, and
  movement and rest, built on what you already do and how the last two weeks have gone.

triggers:
  - diet
  - routine
  - manifestation
  - medicines
  - wellbeing
  - daily plan

examples:
  - What should my daily routine look like?
  - How can I use manifestation and visualisation alongside treatment?

inputs:
  - case_now
  - recommendations
  - wellbeing

scenarios:
  - id: food
    description: >
      Food, fluids and energy. Looking at what is already in the daily plan, the check-in trends and any advisor
      recommendations about diet or supportive care (cite their [R#] tags), suggest up to three small, realistic
      food or fluid habits for this week. If the record mentions swallowing, chewing or mouth problems, shape the
      ideas around them. Do not name supplements, herbs, special diets or fasting.
  - id: rhythm
    description: >
      Daily rhythm, movement and rest. Suggest a simple day structure (morning, afternoon, evening) built from the
      habits already in the plan, plus up to two gentle movement or rest ideas. Anything about activity level is
      something to confirm with the care team.
  - id: mind
    description: >
      Mind and manifestation. Using the patient's own recovery vision if there is one, suggest a short daily practice:
      one intention line, a few minutes of visualisation, breathing and gratitude. Explain in one sentence that these
      support how the person feels and copes and are not a treatment for the cancer.
  - id: on_track
    description: >
      Staying on track and what is working. List the medicines the patient has recorded, exactly as recorded, and
      suggest ways to remember them (a fixed time, a pill box, a tick in the app) and one question for the doctor or
      pharmacist. Then say what the trends show is going well and what to keep an eye on, using the numbers given.

guardrails:
  - Use only the facts given; do not invent the patient's habits, numbers or medicines.
  - Food and routine ideas are general healthy-living suggestions. Never claim that any food, herb, supplement or practice treats, shrinks or cures cancer.
  - Write ideas directly and warmly ("Try...", "Keep...") instead of turning every bullet into a question. Add at most ONE short line per section reminding the patient to confirm with the oncology team or dietitian, and only where it matters (diet changes, activity level, medicines).
  - For medicines only help to organise what is recorded. Never say to take, skip, delay or change a medicine or a dose; send those questions to the doctor or pharmacist.
  - Never mention a dose that is not in the facts.
  - Keep each area to at most three small actions and build on what the person already does. Be warm and encouraging without over-promising.
  - If the facts say something is getting worse (for example pain rising), say it plainly and suggest telling the care team.

output:
  sections:
    - id: focus
      name: Your focus this week
    - id: diet
      name: Diet
    - id: routine
      name: Daily routine
    - id: medicines
      name: Medicines — staying on track
    - id: mind
      name: Mind and manifestation
    - id: movement
      name: Movement and rest
    - id: working
      name: What is working
    - id: ask
      name: Ask your care team

specialist_system_prompt: >
  You are a supportive wellbeing coach for someone living with cancer. Use only the verified facts. Answer the single
  question in short, concrete bullets in plain language. Be kind and practical.

lead_system_prompt: >
  Write one warm, practical weekly strategy for the patient and caregiver from the verified facts and the specialist
  notes. Short bullets, plain language, under 450 words. Start with a two-line "focus" of the most helpful things this
  week. Under "Ask your care team" put two or three questions about diet, activity and medicines. End with exactly this
  line: {disclaimer}

disclaimer: >
  Supportive ideas for daily life, built from your own plan and check-ins. They complement, and never replace, your
  oncology team's treatment, and do not treat the cancer. Confirm diet, activity and medicines with your care team.

follow_ups:
  - Add my favourite ideas to my daily plan
